<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khảo sát PTBV Đại học mở Việt Nam</title>
<style>
  :root{
    --fg:#1a1a1a; --muted:#666; --border:#d7d7d7; --accent:#2457b8; --accent-bg:#eef3fc;
    --err:#b00020; --radius:10px;h
  }
  *{box-sizing:border-box}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    max-width:680px;margin:0 auto;padding:20px 16px 80px;color:var(--fg);background:#fff;line-height:1.5;
  }
  h1{font-size:19px;margin:4px 0 2px}
  h2{font-size:16px;margin:0 0 10px;color:var(--fg)}
  .muted{color:var(--muted);font-size:14px}
  .progress{height:6px;background:#eee;border-radius:4px;margin:14px 0 22px;overflow:hidden}
  .progress-bar{height:100%;background:var(--accent);transition:width .25s}
  .q{margin:18px 0;padding-bottom:4px}
  .q .qtitle{font-weight:600;margin-bottom:8px;font-size:15px}
  .q .help{font-size:13px;color:var(--muted);margin:-4px 0 8px}
  .opt{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;border:1px solid var(--border);
       border-radius:var(--radius);margin:6px 0;cursor:pointer;font-size:14.5px}
  .opt:hover{border-color:var(--accent)}
  .opt input{margin-top:3px;flex:0 0 auto}
  .opt.checked{border-color:var(--accent);background:var(--accent-bg)}
  .scale-row{display:flex;gap:6px;align-items:center;margin:6px 0}
  .scale-row .pt{flex:1;text-align:center;border:1px solid var(--border);border-radius:8px;padding:10px 4px;cursor:pointer;font-size:14px}
  .scale-row .pt.checked{border-color:var(--accent);background:var(--accent-bg);font-weight:600}
  .scale-caption{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}
  textarea,input[type=text],select{width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;font-size:14.5px;font-family:inherit;background:#fff}
  .err{color:var(--err);font-size:13.5px;margin-top:6px}
  .grid-wrap{overflow-x:auto;margin:10px 0 18px;border:1px solid var(--border);border-radius:var(--radius)}
  table.likert-grid{border-collapse:collapse;width:100%;font-size:13px}
  table.likert-grid th{font-weight:600;font-size:11px;color:var(--muted);padding:6px 5px;text-align:center;white-space:normal;max-width:60px;border-bottom:1px solid var(--border)}
  table.likert-grid td{padding:8px 5px;border-top:1px solid var(--border);vertical-align:middle}
  table.likert-grid tr:first-child td{border-top:none}
  table.likert-grid td.qlabel{text-align:left;min-width:200px;font-size:13.5px;line-height:1.35}
  table.likert-grid td.qlabel b{color:var(--accent);margin-right:4px}
  table.likert-grid td.qcell{text-align:center}
  table.likert-grid td.qcell input{width:18px;height:18px;cursor:pointer}
  table.likert-grid td.qlabel,table.likert-grid th:first-child{position:sticky;left:0;background:#fff;z-index:1;box-shadow:2px 0 3px -2px rgba(0,0,0,.15)}
  table.likert-grid td.qlabel .err{margin-top:4px}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:28px}
  button{font-family:inherit;font-size:15px;padding:11px 20px;border-radius:8px;border:1px solid var(--accent);
         background:var(--accent);color:#fff;cursor:pointer}
  button.secondary{background:#fff;color:var(--accent)}
  button:disabled{opacity:.5;cursor:default}
  .note{background:#f7f7f7;border-radius:8px;padding:10px 12px;font-size:13.5px;color:#444;margin:14px 0}
  .bws-item{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin:8px 0}
  .bws-item .txt{flex:1;font-size:14.5px}
  .bws-item label{display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--muted);gap:3px}
  .center{text-align:center;margin-top:30px}
  .hidden{display:none !important}
</style>
</head>

<script>

const GP_ITEMS = {

  GP14:"Xây dựng chính sách hỗ trợ nhóm yếu thế và người học vùng khó khăn",
  GP15:"Xây dựng bộ chỉ số theo dõi phát triển bền vững của hệ thống đại học mở"

const BWS_DESIGNS = {
  A:[[1,2,4,8],[2,3,5,9],[3,4,6,10],[4,5,7,11],[5,6,8,12],[6,7,9,13],[7,8,10,14],[8,9,11,15],[9,10,12,1],[10,11,13,2],[11,12,14,3],[12,13,15,4],[13,14,1,5],[14,15,2,6],[15,1,3,7]],
  B:[[1,2,4,7],[2,3,5,8],[3,4,10,9],[4,5,6,14],[5,10,7,15],[10,6,8,11],[6,7,9,12],[7,8,14,13],[8,9,15,1],[9,14,11,2],[14,15,12,3],[15,11,13,4],[11,12,1,5],[12,13,2,10],[13,1,3,6]],
  C:[[1,2,4,6],[2,3,5,7],[3,4,9,8],[4,5,10,12],[5,9,6,13],[9,10,7,14],[10,6,8,15],[6,7,12,11],[7,8,13,1],[8,12,14,2],[12,13,15,3],[13,14,11,4],[14,15,1,5],[15,11,2,9],[11,1,3,10]]
};

/* ======================================================================
   TRẠNG THÁI PHIÊN
====================================================================== */
function genRid(){
  return 'R' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
const state = {
  rid: genRid(),
  role: null,          // 'student' | 'other'
  hasInstitution: null,// true | false
  answers: {},          // code -> value | array
  bwsVersion: null,
  bwsChoices: [],
  terminated: false
};
const history = []; // stack of visited step ids, for "Quay lại"

/* ======================================================================
   HÀM TIỆN ÍCH DỰNG CÂU HỎI (trả về chuỗi HTML)
====================================================================== */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function radioQ(code, title, options, help){
  const prev = state.answers[code];
  const opts = options.map((o,i) => {
    const id = code+'_'+i;
    const checked = prev === o ? 'checked' : '';
    return `<label class="opt ${checked?'checked':''}" data-opt>
      <input type="radio" name="${code}" value="${esc(o)}" ${checked}> <span>${esc(o)}</span>
    </label>`;
  }).join('');
  return `<div class="q" data-code="${code}" data-type="radio">
    <div class="qtitle">${title}</div>
    ${help?`<div class="help">${help}</div>`:''}
    ${opts}
    <div class="err" data-err></div>
  </div>`;
}

function checkboxQ(code, title, options, help){
  const prev = state.answers[code] || [];
  const opts = options.map((o,i) => {
    const id = code+'_'+i;
    const checked = prev.indexOf(o) !== -1 ? 'checked' : '';
    return `<label class="opt ${checked?'checked':''}" data-opt>
      <input type="checkbox" name="${code}" value="${esc(o)}" ${checked}> <span>${esc(o)}</span>
    </label>`;
  }).join('');
  return `<div class="q" data-code="${code}" data-type="checkbox">
    <div class="qtitle">${title}</div>
    ${help?`<div class="help">${help}</div>`:''}
    ${opts}
    <div class="err" data-err></div>
  </div>`;
}

function textQ(code, title, required, help){
  const prev = state.answers[code] || '';
  return `<div class="q" data-code="${code}" data-type="text" data-required="${required?'1':'0'}">
    <div class="qtitle">${title}</div>
    ${help?`<div class="help">${help}</div>`:''}
    <textarea name="${code}" rows="2">${esc(prev)}</textarea>
    <div class="err" data-err></div>
  </div>`;
}

function likertQ(code, title, scaleValues){
  return radioQ(code, title, scaleValues);
}

// Dropdown + "Khác" tự ghi — dùng cho A4c (mã cơ sở tham chiếu).
function selectOtherQ(code, title, options, help){
  const prev = state.answers[code] || '';
  const isOther = prev && options.indexOf(prev) === -1;
  const opts = options.map(o => `<option value="${esc(o)}" ${prev===o?'selected':''}>${esc(o)}</option>`).join('');
  return `<div class="q" data-code="${code}" data-type="select_other">
    <div class="qtitle">${title}</div>
    ${help?`<div class="help">${help}</div>`:''}
    <select name="${code}" data-select>
      <option value="">— Chọn cơ sở —</option>
      ${opts}
      <option value="__other__" ${isOther?'selected':''}>Khác (cơ sở chưa có trong danh sách)</option>
    </select>
    <input type="text" name="${code}_other" data-other placeholder="Ghi rõ tên hoặc mã cơ sở"
      style="margin-top:8px;${isOther?'':'display:none'}" value="${isOther?esc(prev):''}">
    <div class="err" data-err></div>
  </div>`;
}

// Nhiều câu Likert chung một thang trả lời, hiển thị dạng lưới (mỗi dòng một câu, các cột là
// mức thang đo) — cuộn ngang trên màn hình hẹp, cột nhãn câu hỏi luôn cố định bên trái.
// items: mảng [code, nhãn câu hỏi] (không lặp lại mã câu trong nhãn).
function likertGridQ(items, scaleValues, help){
  const header = scaleValues.map(v => `<th>${esc(v)}</th>`).join('');
  const rows = items.map(([code, label]) => {
    const prev = state.answers[code];
    const cells = scaleValues.map(v => {
      const checked = String(prev) === String(v) ? 'checked' : '';
      return `<td class="qcell"><input type="radio" name="${code}" value="${esc(v)}" ${checked}></td>`;
    }).join('');
    return `<tr class="q" data-code="${code}" data-type="radio">
      <td class="qlabel"><b>${esc(code)}</b>${esc(label)}<div class="err" data-err></div></td>
      ${cells}
    </tr>`;
  }).join('');
  return `${help?`<div class="help">${help}</div>`:''}
  <div class="grid-wrap"><table class="likert-grid">
    <thead><tr><th></th>${header}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function scaleQ(code, title, lowLabel, highLabel){
  const prev = state.answers[code];
  const pts = [1,2,3,4,5].map(n => {
    const checked = String(prev) === String(n) ? 'checked' : '';
    return `<label class="pt ${checked?'checked':''}" data-opt>
      <input type="radio" name="${code}" value="${n}" ${checked} style="display:none">${n}
    </label>`;
  }).join('');
  return `<div class="q" data-code="${code}" data-type="radio">
    <div class="qtitle">${title}</div>
    <div class="scale-row">${pts}</div>
    <div class="scale-caption"><span>${esc(lowLabel)}</span><span>${esc(highLabel)}</span></div>
    <div class="err" data-err></div>
  </div>`;
}

function note(text){ return `<div class="note">${text}</div>`; }

/* ======================================================================
   THU THẬP & KIỂM TRA DỮ LIỆU TỪ MỘT BƯỚC
====================================================================== */
function wireOptionHighlight(container){
  container.querySelectorAll('[data-opt]').forEach(label => {
    const input = label.querySelector('input');
    input.addEventListener('change', () => {
      if (input.type === 'radio') {
        container.querySelectorAll(`input[name="${input.name}"]`).forEach(i => {
          i.closest('[data-opt]').classList.toggle('checked', i.checked);
        });
      } else {
        label.classList.toggle('checked', input.checked);
      }
    });
  });
  // Dropdown "Khác" (selectOtherQ): hiện/ẩn ô nhập tay tương ứng khi đổi lựa chọn.
  container.querySelectorAll('select[data-select]').forEach(sel => {
    sel.addEventListener('change', () => {
      const other = sel.closest('.q').querySelector('input[data-other]');
      if (!other) return;
      other.style.display = sel.value === '__other__' ? '' : 'none';
    });
  });
}

function collectAndValidate(container){
  let ok = true;
  const qs = container.querySelectorAll('.q');
  qs.forEach(q => {
    const code = q.dataset.code;
    const type = q.dataset.type;
    const errBox = q.querySelector('[data-err]');
    errBox.textContent = '';
    if (type === 'radio') {
      const checked = q.querySelector(`input[name="${code}"]:checked`);
      if (checked) {
        state.answers[code] = checked.value;
      } else {
        state.answers[code] = undefined;
        errBox.textContent = 'Vui lòng chọn một phương án.';
        ok = false;
      }
    } else if (type === 'checkbox') {
      const checked = Array.from(q.querySelectorAll(`input[name="${code}"]:checked`)).map(i => i.value);
      state.answers[code] = checked;
      // checkbox luôn không bắt buộc trong bản này trừ khi cần đổi lại
    } else if (type === 'text') {
      const val = q.querySelector(`textarea[name="${code}"]`).value.trim();
      state.answers[code] = val;
      if (q.dataset.required === '1' && !val) {
        errBox.textContent = 'Vui lòng nhập nội dung.';
        ok = false;
      }
    } else if (type === 'select_other') {
      const sel = q.querySelector('select[data-select]').value;
      if (sel === '__other__') {
        const other = q.querySelector('input[data-other]').value.trim();
        state.answers[code] = other;
        if (!other) {
          errBox.textContent = 'Vui lòng ghi rõ tên hoặc mã cơ sở.';
          ok = false;
        }
      } else if (sel) {
        state.answers[code] = sel;
      } else {
        state.answers[code] = undefined;
        errBox.textContent = 'Vui lòng chọn một cơ sở.';
        ok = false;
      }
    }
  });
  return ok;
}

/* ======================================================================
   MÁY TRẠNG THÁI CÁC BƯỚC — mỗi bước: render(), next() quyết định bước sau
====================================================================== */
const app = document.getElementById('app');
const progressBar = document.getElementById('progressBar');
const STEP_ORDER = ['intro','role','roleDetail1','roleDetail2','institutionCode','demographics',
  'b1','b2','c1','b3c2','c3d4','bwsIntro','bws','eSection','f1','submit','end'];

function setProgress(stepId){
  const idx = STEP_ORDER.indexOf(stepId);
  const pct = Math.max(4, Math.round((idx/(STEP_ORDER.length-2))*100));
  progressBar.style.width = Math.min(100,pct) + '%';
}

function renderNav(container, {backDisabled=false, nextLabel='Tiếp tục', onNext, onBack}){
  const nav = document.createElement('div');
  nav.className = 'nav';
  nav.innerHTML = `
    <button class="secondary" id="btnBack" ${backDisabled?'disabled':''}>Quay lại</button>
    <button id="btnNext">${nextLabel}</button>`;
  container.appendChild(nav);
  nav.querySelector('#btnBack').addEventListener('click', onBack || goBack);
  nav.querySelector('#btnNext').addEventListener('click', onNext);
}

function goBack(){
  if (history.length === 0) return;
  const prev = history.pop();
  renderStep(prev, false);
}

function goToStep(stepId, pushCurrent){
  if (pushCurrent) history.push(pushCurrent);
  renderStep(stepId, true);
}

function renderStep(stepId, isForward){
  setProgress(stepId);
  app.innerHTML = '';
  const fn = STEPS[stepId];
  fn(app);
}

/* ---------- intro ---------- */
function stepIntro(container){
  container.innerHTML = `
    <h2>Thông tin nghiên cứu và chấp thuận tham gia</h2>
    <p class="muted">
      Khảo sát này nhằm tìm hiểu thực trạng, các điều kiện bảo đảm và mức độ ưu tiên của các giải pháp
      phát triển bền vững hệ thống đại học mở Việt Nam. Việc tham gia hoàn toàn tự nguyện; Ông/Bà/Anh/Chị
      có thể dừng trả lời bất cứ lúc nào. Không có câu trả lời đúng hay sai. Thông tin chỉ báo cáo ở mức
      tổng hợp, không công bố danh tính cá nhân hoặc cơ sở. Dữ liệu được lưu trong 5 năm, do
      Lê Minh quản lý. Thời gian dự kiến: khoảng 10-20 phút.
      Liên hệ nhóm nghiên cứu: Phạm Phú Thái, email khaosatnghiencuu2026@gmail.com.
    </p>
    ${radioQ('A0','A0. Ông/Bà/Anh/Chị đã đọc thông tin trên và đồng ý tham gia khảo sát?',
      ['Đồng ý tham gia','Không đồng ý và kết thúc khảo sát'])}
  `;
  wireOptionHighlight(container);
  renderNav(container, { backDisabled: true, onNext: () => {
    if (!collectAndValidate(container)) return;
    if (state.answers.A0 === 'Không đồng ý và kết thúc khảo sát') {
      state.terminated = true;
      goToStep('end', 'intro');
    } else {
      goToStep('role', 'intro');

/* ---------- bws: 15 màn hình Best-Worst ---------- */
let bwsScreenOrder = [], bwsCur = 0;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function initBwsScreens(){
  const design = BWS_DESIGNS[state.bwsVersion];
  bwsScreenOrder = shuffle(design.map((_,i) => i));
  bwsCur = 0;
  state.bwsChoices = [];
}
function stepBws(container){
  const design = BWS_DESIGNS[state.bwsVersion];
  const screenIdx = bwsScreenOrder[bwsCur];
  const displayOrder = shuffle(design[screenIdx]);
  container.innerHTML = `
    <h2>Phần D – màn hình ${bwsCur+1}/15</h2>
    ${note('Trong 4 giải pháp dưới đây: tích cột trái (Ưu tiên nhất) cho ĐÚNG MỘT giải pháp nên làm trước nhất, và tích cột phải (Ít ưu tiên nhất) cho ĐÚNG MỘT giải pháp trong số còn lại — không được chọn cùng một giải pháp cho cả hai cột.')}
    <div id="bwsForm"></div>
    <div class="err" id="bwsErr"></div>
  `;
  const form = container.querySelector('#bwsForm');
  form.innerHTML = displayOrder.map(num => {
    const code = 'GP'+num;
    return `<div class="bws-item">
      <label><input type="radio" name="bwsBest" value="${code}"> Ưu tiên<br>nhất</label>
      <div class="txt">${code}. ${esc(GP_ITEMS[code])}</div>
      <label><input type="radio" name="bwsWorst" value="${code}"> Ít ưu tiên<br>nhất</label>
    </div>`;
  }).join('');
  renderNav(container, {
    nextLabel: bwsCur < 14 ? 'Tiếp tục' : 'Hoàn tất Phần D',
    onNext: () => {
      const best = form.querySelector('input[name="bwsBest"]:checked');
      const worst = form.querySelector('input[name="bwsWorst"]:checked');
      const errBox = container.querySelector('#bwsErr');
      if (!best || !worst || best.value === worst.value) {
        errBox.textContent = 'Vui lòng chọn một giải pháp ưu tiên nhất và một giải pháp khác ít ưu tiên nhất.';
        return;
      }
      state.bwsChoices.push({ screenCode: 'S'+(screenIdx+1), displayOrder, best: best.value, worst: worst.value });
      bwsCur++;
      if (bwsCur < bwsScreenOrder.length) {
        renderStep('bws');
      } else {
        goToStep('eSection', 'bws');
      }
    },
    // "Quay lại" trong vòng lặp 15 màn hình phải lùi lại ĐÚNG MỘT MÀN HÌNH Best-Worst
    // (bỏ câu trả lời của màn hình đó), không được pop ra khỏi vòng lặp qua history chung —
    // chỉ màn hình ĐẦU TIÊN (bwsCur===0) mới dùng goBack() thường, để quay ra bwsIntro.
    onBack: bwsCur > 0 ? () => {
      bwsCur--;
      state.bwsChoices.pop();
      renderStep('bws');
    } : undefined
  });
}

/* ======================================================================
   GỌI BACKEND (Apps Script Web App) — POST text/plain để tránh preflight CORS
====================================================================== */
function postToBackend(payload, timeoutMs){
  if (!ENDPOINT_URL || ENDPOINT_URL.indexOf('ĐIỀN_URL') !== -1) {
    return Promise.reject(new Error('ENDPOINT_URL chưa được điền'));
  }
  const fetchPromise = fetch(ENDPOINT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(r => r.json());
  if (!timeoutMs) return fetchPromise;
  const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('Hết thời gian chờ')), timeoutMs));
  return Promise.race([fetchPromise, timeoutPromise]);
}
